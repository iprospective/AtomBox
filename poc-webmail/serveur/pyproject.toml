[project]
name = "atombox"
version = "0.0.1"
description = "AtomBox — le serveur : schéma, magasin d'octets, ingestion IMAP, moteur de filtres, API (D154)"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2",
  "pyyaml>=6",
  "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pglast>=6", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atombox*"]
