<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AtomBox — POC interface</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --panel2:#fafbfc; --line:#e3e6ea; --fg:#1b1f24; --muted:#6b7580;
  --accent:#2f6fed; --accent-soft:#e8f0fe; --warn:#b45309; --ok:#0f7b4f; --danger:#c0392b;
  --shadow:rgba(20,25,35,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#14171c; --panel:#1b1f25; --panel2:#20252c; --line:#2b323b; --fg:#e6e9ed; --muted:#8b95a1;
  --accent:#5b8dff; --accent-soft:#1e2a44; --warn:#d99a3a; --ok:#3fbb85; --danger:#e06c5b;
  --shadow:rgba(0,0,0,.35);
}}
:root[data-theme=dark]{
  --bg:#14171c; --panel:#1b1f25; --panel2:#20252c; --line:#2b323b; --fg:#e6e9ed; --muted:#8b95a1;
  --accent:#5b8dff; --accent-soft:#1e2a44; --warn:#d99a3a; --ok:#3fbb85; --danger:#e06c5b;
  --shadow:rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}

/* ---- header ---- */
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);
  border-bottom:1px solid var(--line)}
.logo{font-weight:700;letter-spacing:-.3px}
.logo span{color:var(--accent)}
.hsearch{flex:1;max-width:520px;position:relative}
.hsearch input{width:100%;padding:7px 11px 7px 30px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel2)}
.hsearch::before{content:"⌕";position:absolute;left:10px;top:5px;color:var(--muted);font-size:15px}
.hspacer{flex:1}
.hbtn{background:none;border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer}
.hbtn:hover{background:var(--accent-soft);border-color:var(--accent)}
.hbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* ---- layout 3+1 colonnes ---- */
.main{display:grid;grid-template-columns:262px 380px 1fr;min-height:0}
.main.qopen{grid-template-columns:262px 340px 1fr 340px}
.col{min-height:0;overflow:auto;background:var(--panel);border-right:1px solid var(--line)}
.col:last-child{border-right:0}
/* sans .qopen, le 4e enfant partirait sur une ligne implicite de la grille */
.main:not(.qopen) #qpanel{display:none}

/* ---- arborescence ---- */
.navsearch{position:sticky;top:0;background:var(--panel);padding:8px;border-bottom:1px solid var(--line);z-index:2}
.navsearch input{width:100%;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.grp{padding:9px 10px 3px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.node{display:flex;align-items:center;gap:7px;padding:4px 10px;cursor:pointer;user-select:none}
.node:hover{background:var(--panel2)}
.node.sel{background:var(--accent-soft);color:var(--accent);font-weight:600}
.node .tw{width:12px;color:var(--muted);font-size:10px;flex:none;text-align:center}
.node .ic{width:16px;flex:none;text-align:center}
.node .lb{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .ct{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.node .ct.b{color:var(--accent);font-weight:700}
.node.child{padding-left:34px}
.node.child2{padding-left:52px}
.more{padding:3px 10px 3px 34px;color:var(--accent);cursor:pointer;font-size:11.5px}
.more:hover{text-decoration:underline}

/* ---- liste ---- */
.lbar{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:7px 9px;z-index:2}
.lbar .t{font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.lbar .t small{font-weight:400;color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:2px 9px;
  font-size:11.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.sortsel{margin-left:auto;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--panel2);font-size:11.5px}
.msg{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.msg:hover{background:var(--panel2)}
.msg.sel{background:var(--accent-soft)}
.msg.unread .from,.msg.unread .subj{font-weight:700}
.msg .r1{display:flex;gap:8px;align-items:baseline}
.msg .from{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .dt{color:var(--muted);font-size:11px;white-space:nowrap}
.msg .subj{margin:1px 0}
.msg .snip{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .meta{margin-top:3px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tag{font-size:10.5px;border-radius:4px;padding:1px 6px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
.tag.ax{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pj{font-size:11px;color:var(--muted)}
.empty{padding:26px 14px;color:var(--muted);text-align:center}

/* ---- détail ---- */
.dhead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;z-index:2}
.dsubj{font-size:16px;font-weight:650;margin-bottom:6px}
.dmeta{color:var(--muted);font-size:12px}
.dacts{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
.thread{padding:12px 16px}
.tm{border:1px solid var(--line);border-radius:8px;margin-bottom:9px;background:var(--panel2)}
.tm .h{padding:8px 11px;display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--line)}
.tm .h b{flex:1}
.tm .b{padding:10px 11px;white-space:pre-wrap}
.tm.cur{border-color:var(--accent)}
.kv{display:flex;gap:8px;padding:2px 0;font-size:12px}
.kv .k{width:104px;color:var(--muted);flex:none}
.box{margin:12px 16px;border:1px solid var(--line);border-radius:8px;padding:11px}
.box h4{margin:0 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}

/* ---- panneau requêtes ---- */
.q{background:var(--panel2)}
.qh{position:sticky;top:0;background:var(--panel2);border-bottom:1px solid var(--line);padding:9px 11px;
  display:flex;align-items:center;gap:8px;z-index:2}
.qh b{flex:1}
.qi{border-bottom:1px solid var(--line);padding:8px 11px}
.qi .lbl{font-size:11px;color:var(--muted);margin-bottom:3px}
.qi code{display:block;white-space:pre-wrap;font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 8px}
.qi .idx{margin-top:4px;font-size:11px;color:var(--ok)}
.qi .idx.w{color:var(--warn)}
.note{padding:10px 11px;color:var(--muted);font-size:11.5px;border-bottom:1px solid var(--line)}

/* ---- pièces jointes ---- */
.pjl{display:flex;flex-direction:column;gap:6px}
.pjc{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:7px;
  padding:7px 9px;background:var(--panel);cursor:pointer}
.pjc:hover{border-color:var(--accent)}
.pjc .pic{font-size:17px;line-height:1.25;flex:none}
.pjc .pn{flex:1;min-width:0}
.pjc .pn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pjc .ps{display:block;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pjc .bd{display:block;margin-top:2px}
.hash{font:10.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.badge{display:inline-block;font-size:10.5px;border-radius:4px;padding:1px 6px;margin:2px 3px 0 0;
  border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.w{border-color:var(--warn);color:var(--warn)}

/* ---- intégration ERP ---- */
.box.erp{border-color:var(--accent)}
.box.erp h4{color:var(--accent)}
.erpl{width:100%;border-collapse:collapse;font-size:12px;margin-top:7px}
.erpl td{padding:3px 8px 3px 0;border-bottom:1px solid var(--line)}
.erpl tr:last-child td{border-bottom:0}
.erpl td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.st{font-size:10.5px;border-radius:4px;padding:1px 6px;border:1px solid var(--line);white-space:nowrap}
.st.ok{border-color:var(--ok);color:var(--ok)}
.st.due{border-color:var(--danger);color:var(--danger)}
.st.wait{border-color:var(--warn);color:var(--warn)}
.qi.api code{border-left:3px solid var(--accent)}

/* ---- responsive ------------------------------------------------------------
   4 paliers : desktop large (4 colonnes) → desktop (3 + requêtes en tiroir)
   → tablette (2 + nav en tiroir) → mobile (1 colonne, navigation par vues).   */
.backbar{display:none;align-items:center;gap:8px;padding:7px 10px;
  border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:3}
.backbar button{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.scrim.on{display:block}

@media (max-width:1240px){
  .main.qopen{grid-template-columns:250px 350px 1fr}
  #qpanel{position:fixed;top:0;right:0;bottom:0;width:min(430px,92vw);z-index:50;
    border-left:1px solid var(--line);box-shadow:-8px 0 24px var(--shadow)}
  .main:not(.qopen) #qpanel{display:none}
}
@media (max-width:980px){
  .main,.main.qopen{grid-template-columns:1fr 1.35fr}
  #nav{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);z-index:45;
    box-shadow:8px 0 24px var(--shadow);transform:translateX(-102%);transition:transform .18s}
  .main.navopen #nav{transform:none}
  #bnav{display:inline-block}
}
@media (max-width:760px){
  header{padding:7px 10px;gap:8px}
  .hsearch{max-width:none}
  .logo{font-size:12px}
  .main,.main.qopen{grid-template-columns:1fr}
  #list,#detail{display:none}
  .main[data-vue=liste]  #list  {display:block}
  .main[data-vue=detail] #detail{display:block}
  .main[data-vue=detail] .backbar{display:flex}
  #qpanel{width:100vw}
  .dsubj{font-size:15px}
  .thread{padding:10px}
  .box{margin:10px}
}
@media (max-width:480px){
  #qn{display:none}
  .hbtn{padding:6px 8px}
  .msg .snip{display:none}
}
</style></head>
<body>
<div class="app">
 <header>
  <button class="hbtn" id="bnav" style="display:none" title="Dossiers">☰</button>
  <div class="logo">Atom<span>Box</span></div>
  <div class="hsearch"><input id="gsearch" placeholder="Rechercher dans tous les messages…"></div>
  <div class="hspacer"></div>
  <button class="hbtn" id="btheme" title="Thème">◐</button>
  <button class="hbtn on" id="bq" title="Journal des requêtes">⟨/⟩ requêtes <span id="qn">0</span></button>
 </header>
 <div class="scrim" id="scrim"></div>
 <div class="main qopen" id="main" data-vue="liste">
  <div class="col" id="nav"></div>
  <div class="col" id="list"></div>
  <div class="col" id="detail"></div>
  <div class="col q" id="qpanel"></div>
 </div>
</div>
<script>
/* ============================================================================
   FIXTURES — cardinalité réaliste (D80) : ~200 fournisseurs, ~50 clients, etc.
   Le volume de messages reste modeste ; c'est la TAILLE DE L'ARBORESCENCE qui
   doit être réaliste, car c'est elle qui décide de la conception de l'écran.
   ========================================================================== */
const rnd = (s => () => (s = s * 16807 % 2147483647) / 2147483647)(42);
const pick = a => a[Math.floor(rnd() * a.length)];
const int  = (a, b) => a + Math.floor(rnd() * (b - a + 1));

const MOTS = ["Acme","Belair","Cardin","Delmas","Estève","Fabre","Garnier","Hublot","Imperia",
  "Jourdan","Klein","Lamotte","Moreau","Naudin","Orsini","Payet","Quintin","Roussel","Sablé",
  "Tessier","Ubald","Vernet","Wagner","Xavier","Yvelin","Zamora","Nord","Sud","Atlantique",
  "Provence","Rhône","Loire","Vallée","Bocage","Colline","Rivage","Plateau","Comptoir","Maison"];
const SUFF = ["SARL","SAS","& Fils","Industries","Services","Distribution","Négoce","Conseil","Group","Atelier"];
const nom = () => pick(MOTS) + " " + pick(SUFF);
const slug = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");

const PRENOMS = ["Marie","Jean","Sophie","Luc","Camille","Thomas","Julie","Pierre","Claire","Nicolas",
  "Anne","David","Laure","Marc","Émilie","Paul","Nadia","Hugo","Sarah","Vincent"];
const NOMS = ["Durand","Martin","Bernard","Petit","Robert","Richard","Dubois","Moreau","Laurent","Simon"];
const pers = () => pick(PRENOMS) + " " + pick(NOMS);

/* ---------------------------------------------------------------------------
   PIÈCES JOINTES — magasin d'octets dédupliqué (D11 / D24 / D32)
   Le BLOB porte les octets, le hash et le type DÉTECTÉ ; la LIAISON porte le
   nom de fichier, le type DÉCLARÉ et l'encodage d'origine. Deux messages
   peuvent nommer le même octet différemment, et un client mail déclare
   parfois n'importe quoi — les deux faits doivent survivre au stockage.
   ------------------------------------------------------------------------- */
const hex   = n => { let s = ""; while (s.length < n) s += "0123456789abcdef"[int(0, 15)]; return s; };
const poids = k => k < 1024 ? k + " ko"
  : (k / 1024).toFixed(k < 10240 ? 1 : 0).replace(".", ",") + " Mo";
const euro  = n => n.toLocaleString("fr-FR") + " €";
const mimeC = t => t.replace("application/vnd.openxmlformats-officedocument.", "…ooxml.")
                    .replace("spreadsheetml.sheet", "xlsx")
                    .replace("wordprocessingml.document", "docx");

const BLOBS = [];
const blob = o => { const b = { pj_id: BLOBS.length + 1, sha: hex(12), refs: 1, ...o };
                    BLOBS.push(b); return b; };

const XLSX = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
const DOCX = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";

/* Blobs RÉCURRENTS : à eux seuls, ils justifient la déduplication. */
const RECUR = [
  blob({ nom:"signature-logo", ext:"png",  mime:"image/png",       ko:34,   ic:"🖼", refs:1284 }),
  blob({ nom:"CGV-2026",       ext:"pdf",  mime:"application/pdf", ko:212,  ic:"📄", refs:96 }),
  blob({ nom:"tarifs-2026",    ext:"xlsx", mime:XLSX,              ko:344,  ic:"📊", refs:41 }),
  blob({ nom:"plaquette-2026", ext:"pdf",  mime:"application/pdf", ko:2460, ic:"📄", refs:18, photo:true }),
];

const PJT = [
  { ext:"pdf",  mime:"application/pdf", ic:"📄", ko:[38,1400],
    noms:["Facture {n}","Devis {n}","BL {n}","Contrat de maintenance","Releve {n}"] },
  { ext:"pdf",  mime:"application/pdf", ic:"📄", ko:[38,1400],
    noms:["Avoir {n}","Bon de commande {n}","Attestation {n}"] },
  { ext:"jpg",  mime:"image/jpeg", ic:"🖼", ko:[1900,7600], photo:true,
    noms:["IMG_{n}","photo-chantier-{n}","montage-{n}"] },
  { ext:"png",  mime:"image/png",  ic:"🖼", ko:[110,2400], photo:true,
    noms:["capture-{n}","schema-{n}"] },
  { ext:"xlsx", mime:XLSX, ic:"📊", ko:[22,480],  noms:["inventaire-{n}","suivi-commandes-{n}"] },
  { ext:"docx", mime:DOCX, ic:"📝", ko:[30,340],  noms:["compte-rendu-{n}","cahier-des-charges-{n}"] },
  { ext:"zip",  mime:"application/zip",  ic:"🗜", ko:[420,9200], noms:["dossier-{n}","photos-chantier-{n}"] },
  { ext:"eml",  mime:"message/rfc822",   ic:"✉", ko:[14,180], eml:true, noms:["message-transfere-{n}"] },
];

function lien(b, noms) {
  const base = noms ? pick(noms).replace("{n}", "" + int(1000, 9999)) : b.nom;
  return { b, nom: base + "." + b.ext,
           declare: rnd() < .12 ? "application/octet-stream" : b.mime,   // divergence D32
           enc: b.ext === "eml" ? "8bit" : "base64" };
}

function attachePJ(m) {
  m.pjs = [];
  if (rnd() < .38) { const n = int(1, 3);
    for (let k = 0; k < n; k++) { const t = pick(PJT);
      m.pjs.push(lien(blob({ ext:t.ext, mime:t.mime, ic:t.ic, photo:t.photo, eml:t.eml,
        ko:int(t.ko[0], t.ko[1]), refs: rnd() < .15 ? int(2, 6) : 1 }), t.noms)); } }
  if (rnd() < .30) m.pjs.push(lien(pick(RECUR)));          // signature, CGV, tarifs…
  m.pj    = m.pjs.length;
  m.pj_ko = m.pjs.reduce((s, p) => s + p.b.ko, 0);
  m.size  = int(4, 60) + Math.round(m.pj_ko * 1.37);       // base64 : +37 % sur le fil (D69)
}

/* ---------------------------------------------------------------------------
   APPLICATIONS CONNECTÉES — le métier n'est PAS dans AtomBox (D19 / D21)
   AtomBox porte le tag et la RÉFÉRENCE EXTERNE ; les montants ci-dessous sont
   ceux que l'application renverrait à l'affichage. Rien n'est recopié.
   ------------------------------------------------------------------------- */
const ERP_APPS = {
  client:       { app:"dolibarr-mmi",  nom:"Dolibarr — MMI Négoce", ic:"🏢", pref:"TH",   objet:"tiers" },
  fournisseur:  { app:"dolibarr-mmi",  nom:"Dolibarr — MMI Négoce", ic:"🏢", pref:"TH",   objet:"fournisseur" },
  sav:          { app:"redmine-ipro",  nom:"Redmine — support",     ic:"🛟", pref:"#",    objet:"demande" },
  partenaire:   { app:"nextcloud-mmi", nom:"Nextcloud — partage",   ic:"☁",  pref:"grp-", objet:"groupe" },
};
const PIECES = [["Devis","PR",["accepté","en attente","refusé"]],
                ["Commande","CO",["expédiée","en préparation","validée"]],
                ["Facture","FA",["payée","impayée","en retard"]]];
const OK_ST = { "payée":1, "accepté":1, "expédiée":1, "validée":1 };
const KO_ST = { "impayée":1, "en retard":1, "refusé":1 };

const FICHES = {};
function fiche(axe, val) {
  const k = axe + "|" + val;
  if (FICHES[k]) return FICHES[k];
  const cfg = ERP_APPS[axe]; if (!cfg) return null;
  const objets = [];
  for (let i = 0, n = int(2, 5); i < n; i++) {
    const P = pick(PIECES);
    objets.push({ type:P[0], statut:pick(P[2]), montant:int(120, 24000),
      ref: P[1] + "26" + String(int(1, 12)).padStart(2, "0") + "-" + String(int(1, 999)).padStart(4, "0") });
  }
  const du = objets.filter(o => o.type === "Facture" && o.statut !== "payée");
  return FICHES[k] = { cfg, ref: cfg.pref + int(1000, 9999), objets,
    encours: du.reduce((s, o) => s + o.montant, 0),
    echu:    du.filter(o => o.statut === "en retard").reduce((s, o) => s + o.montant, 0),
    depuis:  2010 + int(0, 14) };
}

/* Les six familles de D76 : un AXE, ses VALEURS. */
const AXES = [
  { id:"fournisseur",  label:"Fournisseurs",    icon:"📦", n:200 },
  { id:"client",       label:"Clients",         icon:"🏢", n:52,  sub:"en cours" },
  { id:"partenaire",   label:"Partenaires",     icon:"🤝", n:14 },
  { id:"collaborateur",label:"Collaborateurs",  icon:"👥", n:11 },
  { id:"sav",          label:"SAV",             icon:"🛟", n:23,  ticket:true },
  { id:"notification", label:"Notifications",   icon:"🔔", n:6,   fixed:["Urgences","Debug","Monitoring","Sauvegardes","CI/CD","Sécurité"] },
  { id:"social",       label:"Réseaux sociaux", icon:"💬", n:5,   fixed:["LinkedIn","Facebook","Instagram","X","YouTube"] },
];

const valeurs = {};
AXES.forEach(a => {
  valeurs[a.id] = [];
  const n = a.fixed ? a.fixed.length : a.n;
  for (let i = 0; i < n; i++) {
    const label = a.fixed ? a.fixed[i]
                : a.id === "collaborateur" ? pers()
                : a.ticket ? "Ticket #" + (4200 + i * 7)
                : nom();
    valeurs[a.id].push({
      id: a.id + ":" + slug(label) , label,
      unread: rnd() < .38 ? int(1, a.id === "notification" ? 240 : 9) : 0,
      total: int(3, 180),
      actif: rnd() < .45,                       // « clients en cours »
      last: Date.now() - int(0, 400) * 864e5,
    });
  }
  valeurs[a.id].sort((x, y) => y.last - x.last);
});

/* Dossiers spéciaux (D51 : des VUES, pas des entités) + dossiers utilisateur */

/* Messages : générés à la demande pour le dossier ouvert (le POC est statique). */
const SUJETS = ["Devis {n}","Facture {n}","Relance facture {n}","Commande {n} expédiée",
  "Re: Commande {n}","Bon de livraison {n}","Contrat de maintenance","Demande d'information",
  "Réclamation client","Planning d'intervention","Avoir {n}","Confirmation de rendez-vous"];
const CORPS = ["Bonjour,\n\nComme convenu lors de notre échange, vous trouverez ci-joint les éléments demandés.\n\nBien cordialement,",
  "Bonjour,\n\nNous accusons réception de votre demande. Un retour vous sera fait sous 48 heures.\n\nCordialement,",
  "Bonjour,\n\nPourriez-vous nous confirmer les quantités avant expédition ?\n\nMerci d'avance,",
  "Bonjour,\n\nLe document est en pièce jointe. N'hésitez pas si vous avez des questions.\n\nBien à vous,"];

function messages(folderId, label) {
  const out = [], n = int(14, 40);
  for (let i = 0; i < n; i++) {
    const who = folderId.startsWith("collaborateur") ? label : pers();
    const dom = slug(label).slice(0, 14) + ".fr";
    const sujet = pick(SUJETS).replace("{n}", "" + int(1000, 9999));
    out.push({
      id: folderId + "/m" + i,
      from: who, mail: slug(who).replace(/-/g, ".") + "@" + dom,
      subject: (rnd() < .3 ? "Re: " : "") + sujet,
      snippet: pick(CORPS).split("\n")[2] || "…",
      body: pick(CORPS),
      date: Date.now() - int(0, 300) * 864e5 - int(0, 86399) * 1000,
      unread: rnd() < .3,
      thread: int(1, 4),
      tags: [],
    });
    const m = out[out.length - 1];
    attachePJ(m);                       // pièces jointes réelles + poids réel du message
    const ax = folderId.split(":")[0];
    if (AXES.some(a => a.id === ax)) m.tags.push({ axe: ax, val: label, src: "dolibarr-mmi" });
    if (rnd() < .25) m.tags.push({ axe: "projet", val: "RM" + int(2800, 2900), src: "redmine-ipro" });
    if (rnd() < .18) m.tags.push({ axe: "type", val: pick(["facture","devis","contrat"]), src: "filtre" });
  }
  return out.sort((a, b) => b.date - a.date);
}

  QLOG.unshift({ label, sql, index, warn, kind, t: new Date() });
  if (QLOG.length > 40) QLOG.pop();
  document.getElementById("qn").textContent = QLOG.length;

}

/* ============================================================================
   ARBORESCENCE — engendrée depuis les axes (D77), jamais créée à la main

function renderNav() {
  const n = document.getElementById("nav");
  const f = S.navq.trim().toLowerCase();
  let h = `<div class="navsearch"><input id="navq" placeholder="Filtrer les dossiers…"
     value="${esc(S.navq)}"></div>`;

  const node = (o, cls, sel) =>
    `<div class="node ${cls}${sel ? " sel" : ""}" data-id="${esc(o.id)}" data-label="${esc(o.label)}"
       data-kind="${o.kind || ""}" data-axe="${o.axe || ""}">
       <span class="tw">${o.tw || ""}</span><span class="ic">${o.icon || ""}</span>
       <span class="lb">${esc(o.label)}</span>
       <span class="ct${o.unread ? " b" : ""}">${o.unread ? o.unread : (o.total || "")}</span></div>`;

  if (!f) {
    h += `<div class="grp">Dossiers</div>`;
    SPECIAUX.forEach(o => h += node({ ...o, kind:"special" }, "", S.folder.id === o.id));
    UTIL.forEach(o => h += node({ ...o, kind:"user" }, "", S.folder.id === o.id));
  }

  AXES.forEach(a => {
    const vals = valeurs[a.id].filter(v => !f || v.label.toLowerCase().includes(f));
    if (f && !vals.length) return;
    const open = S.ouverts[a.id] || !!f;
    const nu = valeurs[a.id].reduce((s, v) => s + v.unread, 0);
    h += `<div class="grp">${esc(a.label)}${a.sub ? " · " + a.sub : ""}</div>`;
    h += node({ id:"axe:" + a.id, label:"Tous — " + a.label, icon:a.icon, unread:nu,
                tw: open ? "▾" : "▸", kind:"axe", axe:a.id }, "", S.folder.id === "axe:" + a.id);
    if (!open) return;
    const lim = S.plus[a.id] ? vals.length : PAGE;
    vals.slice(0, lim).forEach(v => h += node(
      { ...v, icon: a.id === "client" && v.actif ? "🟢" : "•", kind:"virtuel", axe:a.id },
      "child", S.folder.id === v.id));
    if (vals.length > lim)
      h += `<div class="more" data-more="${a.id}">voir les ${vals.length - lim} autres…</div>`;
  });
  n.innerHTML = h;

  const inp = document.getElementById("navq");
  inp.oninput = e => { S.navq = e.target.value; const p = e.target.selectionStart;
    renderNav(); const i2 = document.getElementById("navq"); i2.focus(); i2.setSelectionRange(p, p);
    if (S.navq.length === 1)
      q("Recherche dans l'arborescence", `SELECT axe_id, valeur, count(*) FILTER (WHERE r.lu_le IS NULL)
  FROM tag t JOIN message_tag mt USING (tag_id) JOIN rattachement r USING (message_id)
 WHERE r.compte_id = :moi AND t.valeur ILIKE :q || '%'
 GROUP BY axe_id, valeur LIMIT 50;`, "index (valeur text_pattern_ops) — sinon balayage de tous les tags", true);
  };
  n.querySelectorAll(".node").forEach(el => el.onclick = () => {
    const id = el.dataset.id;
    if (el.dataset.kind === "axe") { const a = el.dataset.axe;
      if (S.folder.id === id) { S.ouverts[a] = !S.ouverts[a]; renderNav(); return; }
      S.ouverts[a] = true; }
    open({ id, label: el.dataset.label, kind: el.dataset.kind, axe: el.dataset.axe });
  });
  n.querySelectorAll(".more").forEach(el => el.onclick = () => {
    S.plus[el.dataset.more] = true; renderNav();
    q("Charger le reste d'un axe", `SELECT valeur, count(*) FROM tag t JOIN message_tag mt USING (tag_id)
  JOIN rattachement r USING (message_id)
 WHERE r.compte_id = :moi AND t.axe_id = :axe
 GROUP BY valeur ORDER BY max(r.recu_le) DESC OFFSET :n LIMIT 200;`,
      "index (axe_id, valeur) — pagination de l'arborescence elle-même");
  });
}

function open(folder) {
  S.folder = folder; S.sel = null;
  S.msgs = messages(folder.id, folder.label);
  const where = folder.kind === "special"
      ? `r.boite_id = :boite AND <vue ${folder.id}>`
    : folder.kind === "user" ? `r.dossier_id = :dossier`
    : folder.kind === "axe"  ? `t.axe_id = :axe            -- récursif : l'axe sans la valeur`
    : `t.axe_id = :axe AND t.valeur = :valeur`;
  q("Ouvrir « " + folder.label + " »",
`SELECT m.message_id, m.from_nom, m.sujet, m.snippet, m.nb_pieces_jointes, r.lu_le
  FROM rattachement r JOIN message m USING (message_id)${folder.kind.startsWith("v") || folder.kind === "axe"
   ? "\n  JOIN message_tag mt USING (message_id) JOIN tag t USING (tag_id)" : ""}
 WHERE r.compte_id = :moi AND ${where}
 ORDER BY m.date_reception DESC
 LIMIT 50;`,
    folder.kind === "axe" || folder.kind === "virtuel"
      ? "index (tag_id, sorti_le DESC, message_id) — D16, date dénormalisée dans la liaison"
      : "index (compte_id, sorti_le DESC) — D36 : la portée EST le chemin d'accès");
  renderNav(); renderList(); renderDetail();
  if (MOBILE()) setVue("liste"); else closeNav();
}

function filtered() {
  let a = S.msgs.slice();
  if (S.filtre === "non_lus") a = a.filter(m => m.unread);
  if (S.filtre === "recents") a = a.filter(m => Date.now() - m.date < 30 * 864e5);
  if (S.filtre === "pj")      a = a.filter(m => m.pj);
  if (S.filtre === "lourds")  a = a.filter(m => m.size > 2048);
  const T = { date_desc:(x,y)=>y.date-x.date, date_asc:(x,y)=>x.date-y.date,
              from:(x,y)=>x.from.localeCompare(y.from),
              subj:(x,y)=>x.subject.localeCompare(y.subject),
              size:(x,y)=>y.size-x.size };
  return a.sort(T[S.tri]);
}

          <span class="ps">${poids(b.ko)} · <span class="hash">sha256:${b.sha}…</span></span>

            <span class="badge" title="${esc(b.mime)}">${esc(mimeC(b.mime))}</span>

      </div>`).join("")}</div>`;

  q("Ouvrir un message + son fil",
`SELECT m.*, r.lu_le FROM message m JOIN rattachement r USING (message_id)
 WHERE m.message_id = :id AND r.compte_id = :moi;          -- la portée reste le chemin (D36)

SELECT message_id, from_nom, date_reception FROM message
 WHERE thread_id = :thread ORDER BY date_reception;        -- fil complet`,
    "index (thread_id, date_reception) — D55 ; ⚠ jamais SELECT * : headers TOASTés (D27)");

  bindBack(el);
  el.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const A = {
      rep:["Répondre depuis la boîte du message (Q26)",
`-- l'identité d'envoi par défaut est celle de la BOÎTE, pas du compte
SELECT b.adresse FROM rattachement r JOIN boite b USING (boite_id)
 WHERE r.message_id = :id AND r.compte_id = :moi;`, "évite le fil amputé après révocation (Q26)"],
      tr:["Transférer — interne par référence (D58)",
`INSERT INTO message_lien (message_porteur, message_source, type) VALUES (:new, :id, 'reference');
INSERT INTO acl_message (message_id, principal, droit, accorde_par) VALUES (:id, :dest, 'lire', :moi);`,
        "aucune copie : le message reste unique (D10/D58)"],
      tag:["Poser un tag",
`INSERT INTO message_tag (message_id, tag_id, source) VALUES (:id, :tag, :application)
 ON CONFLICT DO NOTHING;   -- pas d'unicité (message, axe) : deux clients possibles (D17)`,
        "ACL de l'axe vérifiée en amont (D18) ; axes autorisés injectés en axe_id IN (…)"],
      traite:["Marquer traité",
`UPDATE rattachement SET sorti_le = now(), motif_sortie = 'traite'
 WHERE message_id = :id AND compte_id = :moi;
INSERT INTO activite (compte_id, message_id, type, at) VALUES (:moi, :id, 'traite', now());`,
        "⚠ déplace la ligne de partition si sorti_le est la clé (D14/D30) — un seul déplacement par email", true],
      arch:["Archiver (sortir de la file sans traiter)",
`UPDATE rattachement SET sorti_le = now(), motif_sortie = 'archive'
 WHERE message_id = :id AND compte_id = :moi;`,
        "motif_sortie distingue traité / archivé — D30 ; la vue Trash/Archive en découle (D51)"],
      orig:["Télécharger le message original (.eml)",
`-- réassemblage : le corps, puis chaque partie ré-encodée À L'IDENTIQUE (D25)
SELECT blob_ref, headers FROM message WHERE message_id = :id;
SELECT l.ordre, l.nom_fichier, l.mime_declare, l.transfer_encoding, l.disposition,
       l.parametres, p.blob_ref
  FROM message_piece_jointe l JOIN piece_jointe p USING (pj_id)
 WHERE l.message_id = :id ORDER BY l.ordre;`,
        "la liaison doit conserver l'ordre, l'encodage et les paramètres de partie : sans eux le " +
        "message se reconstruit mais DKIM ne se revérifie plus (D25/D26) — d'où le verdict figé à l'ingestion"],
    }[b.dataset.a];
    q(A[0], A[1], A[2], A[3]);
  });

  /* ---- pièces jointes : ouvrir, remonter la dédup, recompresser ---------- */
  el.querySelectorAll(".pjc").forEach(c => c.onclick = () => {
    const p = m.pjs[+c.dataset.pj], b = p.b;
    q("Ouvrir « " + p.nom + " »",
`SELECT p.blob_ref, p.sha256, p.mime_detecte, p.octets,
       l.nom_fichier, l.mime_declare, l.transfer_encoding, l.ordre
  FROM message_piece_jointe l JOIN piece_jointe p USING (pj_id)
 WHERE l.message_id = :id AND l.pj_id = ` + b.pj_id + `;
-- les octets ne transitent jamais par PostgreSQL : zstd -d <blob_ref> (D05/D07)`,
      "index (message_id, ordre) sur la liaison — le fichier lui-même reste hors base");
    q("« " + p.nom + " » — qui d'autre porte CES octets ?",
`SELECT m.message_id, m.sujet, l.nom_fichier, m.date_reception
  FROM message_piece_jointe l JOIN message m USING (message_id)
 WHERE l.pj_id = ` + b.pj_id + `      -- ` + b.refs + ` liaison(s) pour un seul blob de ` + poids(b.ko) + `
 ORDER BY m.date_reception DESC LIMIT 50;`,
      b.refs > 1
        ? "index (pj_id, message_id) — sans ce sens de parcours, la dédup n'est qu'un gain de disque : "
          + "ici elle économise " + poids(b.ko * (b.refs - 1)) + " et donne « où ai-je déjà vu ce fichier ? » (D24)"
        : "index (pj_id, message_id) — un seul porteur ici : sur ce fichier la dédup ne gagne rien, "
          + "et c'est le cas le plus fréquent. Le gain vient des quelques blobs très partagés");
    if (b.photo && b.ko > 2000) q("Recompression proposée (D70)",
`-- geste EXPLICITE, jamais automatique
UPDATE piece_jointe
   SET blob_origine = blob_ref, blob_ref = :neuf, octets = :neufs, recompresse_le = now()
 WHERE pj_id = ` + b.pj_id + `;`,
      "⚠ le blob est partagé par " + b.refs + " liaison(s) : un seul UPDATE libère ≈ " +
      poids(Math.round(b.ko * .62)) + " mais modifie l'octet de TOUS les porteurs — " +
      "l'original doit rester tant qu'un message doit être revérifiable (D25/D26)", true);
  });

  /* ---- intégration ERP : les deux sens (D03/D19/D20/D21) ---------------- */
  el.querySelectorAll("[data-e]").forEach(bt => bt.onclick = () => {
    const t = m.tags.find(x => ERP_APPS[x.axe]); if (!t) return;
    const f = fiche(t.axe, t.val), c = f.cfg, o = pick(f.objets);
    const E = {
      res:["Comment ce message a été rattaché à « " + t.val + " »",
`-- 1. l'adresse pointe une IDENTITÉ, jamais l'inverse (D35)
SELECT c.correspondant_id, c.libelle
  FROM adresse a JOIN correspondant c USING (correspondant_id)
 WHERE a.adresse = lower('` + m.mail + `');        -- index UNIQUE (adresse)

-- 2. l'identité est reliée au tiers de CHAQUE application connectée
SELECT application_id, ref_externe FROM correspondant_externe
 WHERE correspondant_id = :cid;                    -- ` + c.app + ` → ` + f.ref + `

-- 3. c'est le CONNECTEUR qui pose le tag, pas AtomBox (D21)`,
        "un correspondant, N adresses : changer d'adresse ne coupe pas l'historique du tiers (D35). " +
        "Adresse inconnue ⇒ message sans tag : c'est voulu, pas un échec d'ingestion", false],
      lie:["Lier ce message à " + o.type.toLowerCase() + " " + o.ref,
`POST /api/v1/messages/{message_id}/tags        Authorization: Bearer <token ` + c.app + `>
{ "axe": "` + t.axe + `", "valeur": "` + t.val + `",
  "ref_externe": "` + f.ref + `", "piece": "` + o.ref + `" }

-- côté AtomBox
INSERT INTO tag (axe_id, application_id, valeur, ref_externe)
VALUES (:axe, :app, :valeur, :ref)
ON CONFLICT (axe_id, application_id, valeur) DO UPDATE
   SET ref_externe = EXCLUDED.ref_externe
RETURNING tag_id;
INSERT INTO message_tag (message_id, tag_id, pose_par, pose_le)
VALUES (:id, :tag, :application, now()) ON CONFLICT DO NOTHING;`,
        "l'application est DANS la clé d'unicité (axe, application, valeur) — D20 : quatre Dolibarr " +
        "font quatre jeux de tags et aucun n'écrase l'autre (D17). ACL de l'axe vérifiée avant (D18)",
        false, "api"],
      inv:["Onglet « Emails » de la fiche " + f.ref + ", vu depuis " + c.app,
`GET /api/v1/messages?axe=` + t.axe + `&valeur=` + encodeURIComponent(t.val) + `
    &application=` + c.app + `&limite=20&curseur=eyJkIjoiMjAyNi0wMy0xMSIsImkiOjkxfQ
Authorization: Bearer <token opaque de l'application>          -- D63

-- côté AtomBox
SELECT m.message_id, m.sujet, m.from_adresse, m.date_reception, m.nb_pieces_jointes
  FROM message_tag mt JOIN message m USING (message_id)
 WHERE mt.tag_id = :tag
   AND m.boite_id = ANY (:portee_du_token)                     -- D37
   AND (m.date_reception, m.message_id) < (:cur_date, :cur_id) -- curseur, pas OFFSET
 ORDER BY m.date_reception DESC, m.message_id DESC
 LIMIT 20;`,
        "⚠ index (tag_id, date_reception DESC, message_id DESC). Deux pièges : un ERP pagine PROFOND " +
        "(OFFSET interdit) et la portée du token s'applique ICI, jamais dans l'appelant (D18/D37)",
        true, "api"],
      push:["Notifier " + c.app + " (événement sortant)",
`POST https://` + c.app + `.lan/api/atombox/hook          (asynchrone, rejouable)
{ "evenement": "message.tague", "message_id": "…", "axe": "` + t.axe + `",
  "valeur": "` + t.val + `", "ref_externe": "` + f.ref + `", "pieces_jointes": ` + m.pj + ` }

-- rien n'est émis dans la transaction d'ingestion : on empile, un worker vide
INSERT INTO evenement_sortant (application_id, type, charge, etat, prochaine_tentative)
VALUES (:app, 'message.tague', :json::jsonb, 'a_emettre', now());`,
        "index PARTIEL (prochaine_tentative) WHERE etat <> 'emis' — la file reste minuscule après des " +
        "millions d'événements, et une application injoignable ne bloque jamais la réception",
        false, "api"],
    }[bt.dataset.e];
    q(E[0], E[1], E[2], E[3], E[4]);
  });
}

/* ============================================================================
   PANNEAU DES REQUÊTES
   ========================================================================== */
function renderQ() {
  const el = document.getElementById("qpanel");
  el.innerHTML = `<div class="qh"><b>Requêtes impliquées</b>
      <button class="hbtn" id="qclr">vider</button></div>
    <div class="note">Le livrable du POC, au-delà des écrans (D79) : chaque geste note la
      question qu'il pose aux données. C'est cette liste qui dictera les index.</div>
    ${QLOG.map(i => `<div class="qi${i.kind ? " " + i.kind : ""}">
      <div class="lbl">${i.t.toTimeString().slice(0,8)} — ${esc(i.label)}
        ${i.kind === "api" ? `<span class="badge">API</span>` : ""}</div>
      <code>${esc(i.sql)}</code>
      ${i.index ? `<div class="idx${i.warn ? " w" : ""}">${i.warn ? "⚠ " : "↳ "}${esc(i.index)}</div>` : ""}
    </div>`).join("")}`;
  el.querySelector("#qclr").onclick = () => { QLOG.length = 0;
    document.getElementById("qn").textContent = 0; renderQ(); };
}

/* ============================================================================
   DÉMARRAGE
   ========================================================================== */
document.getElementById("btheme").onclick = () => {
  const r = document.documentElement;
  const cur = r.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  r.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
};
const bq = document.getElementById("bq");
function setQ(on) {
  document.getElementById("main").classList.toggle("qopen", on);
  bq.classList.toggle("on", on);
  try { localStorage.setItem("abx.q", on ? "1" : "0"); } catch (e) {}
}
bq.onclick = () => setQ(!document.getElementById("main").classList.contains("qopen"));
addEventListener("keydown", e => {
  if (e.key === "Escape" && document.getElementById("main").classList.contains("qopen")) setQ(false);
});
try { if (localStorage.getItem("abx.q") === "0") setQ(false); } catch (e) {}
document.getElementById("gsearch").oninput = e => {
  if (e.target.value.length !== 3) return;
  q("Recherche globale plein texte",
`SELECT m.message_id, ts_rank(m.corps_tsv, plainto_tsquery('french', :q)) AS rang
  FROM rattachement r JOIN message m USING (message_id)
 WHERE r.compte_id = :moi                      -- la portée d'abord (D36)
   AND m.corps_tsv @@ plainto_tsquery('french', :q)
   AND r.sorti_le > now() - interval '2 years'  -- fenêtre par défaut : sans elle, pas d'élagage (C06)
 ORDER BY rang DESC LIMIT 50;`,
    "GIN sur corps_tsv, chaud sur la zone active seulement (D34) — archives sur disque lent");
};
document.getElementById("bnav").onclick = () =>
  MOBILE() ? setVue("nav") : (document.getElementById("main").classList.contains("navopen")
    ? closeNav() : openNav());
document.getElementById("scrim").onclick = () => { closeNav(); setQ(false); };
addEventListener("resize", () => { if (!TABLET()) closeNav();
  if (!MOBILE()) document.getElementById("main").dataset.vue = "liste"; });

S.ouverts.fournisseur = true;
open(S.folder); qCompteurs();
</script></body></html>
