[alembic]
script_location = atombox/schema/migrations
prepend_sys_path = .
# l'URL vient de DATABASE_URL (env.py) — jamais dans un fichier versionné
sqlalchemy.url =

[loggers]
keys = root,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
