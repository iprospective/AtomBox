# managed-by: serveur/outils/deployer-apache.sh (AtomBox) — reverse proxy vers l'API (uvicorn) qui sert aussi le webmail
<VirtualHost *:80>
    ServerName atombox.dev.lxc

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass        / http://127.0.0.1:8010/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:8010/

    ErrorLog  ${APACHE_LOG_DIR}/atombox.dev.lxc.error.log
    CustomLog ${APACHE_LOG_DIR}/atombox.dev.lxc.access.log combined
</VirtualHost>
